name: CodeQL SAST PoC Angular
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '47 5 * * 3'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    uses: DavidFaustino/ssdlc-codeql-poc/.github/workflows/codeql-reusable.yml@836fab41ce4b2153abc90ada9cd5a4e50764924a
    with:
      profile: angular
      query_suite: default
      policy_mode: observe
