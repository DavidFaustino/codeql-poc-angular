name: CodeQL SAST PoC Angular
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '47 5 * * 3'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    uses: DavidFaustino/ssdlc-codeql-poc/.github/workflows/codeql-reusable.yml@e44e1d97cd6ba43017233904e6c9b910a9e9cecd
    with:
      profile: angular
      query_suite: default
