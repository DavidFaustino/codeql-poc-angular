name: CodeQL SAST PoC Angular
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '47 5 * * 3'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    uses: DavidFaustino/ssdlc-codeql-poc/.github/workflows/codeql-reusable.yml@4487836e1b34ba737d33a395c3787cc1c6e1c680
    with:
      profile: angular
      query_suite: default
      policy_mode: observe
